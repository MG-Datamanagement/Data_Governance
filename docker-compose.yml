version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: metaportal_postgres
    environment:
      POSTGRES_USER: metaportal_user
      POSTGRES_PASSWORD: metaportal_pass
      POSTGRES_DB: metaportal_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - metaportal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaportal_user -d metaportal_db -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: metaportal_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metaportal.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - metaportal_network
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: metaportal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - metaportal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  solr:
    image: solr:9.6.1
    container_name: metaportal_solr
    environment:
      - SOLR_JAVA_MEM=-Xms1g -Xmx2g
    ports:
      - "8983:8983"
    volumes:
      - ./solr-config:/solr-config
    networks:
      - metaportal_network
    command: sh -c "solr-precreate metaportal_core /solr-config/conf"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8983/solr/metaportal_core/select?q=*:* || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  solr_data:

networks:
  metaportal_network:
    driver: bridge