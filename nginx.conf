# nginx.conf
server {
    listen 80;
    server_name localhost;

    # CORS headers
    set $cors_origin "http://localhost:3000";
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin" always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # CRITICAL: Healthcheck endpoint for docker-compose
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy /api to datahub-gms (REST APIs)
    location /api/ {
        proxy_pass http://datahub-gms:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /openapi to datahub-gms
    location /openapi/ {
        proxy_pass http://datahub-gms:8080/openapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # GraphQL endpoint (WORKING!)
    location /graphql {
        proxy_pass http://datahub-gms:8080/api/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type "application/json";
    }
}




