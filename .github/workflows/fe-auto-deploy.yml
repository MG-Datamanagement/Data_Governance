name: FE Auto Deploy to Azure VM

on:
  push:
    branches:
      - feat/graphql-implementation  # updated branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy App
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e

            # Define the authenticated remote URL using the PAT secret
            AUTH_URL="https://${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}.git"

            cd ${{ secrets.APP_DIR }}

            # Check if directory has git initialized
            if [ -d ".git" ]; then
              echo "Directory has git, applying PAT URL and pulling latest..."
              git remote set-url origin $AUTH_URL
              git reset --hard
              git clean -fd
              git pull origin feat/graphql-implementation  # updated branch
            else
              echo "Directory not a git repo, initializing..."
              git init
              git remote add origin $AUTH_URL
              git fetch
              git checkout -t origin/feat/graphql-implementation  # updated branch
            fi

            # Install dependencies
            npm install --legacy-peer-deps

            # Restart app via PM2
            pm2 delete fe-app || true 
            pm2 start npm --name fe-app -- run dev
            pm2 save
          EOF
