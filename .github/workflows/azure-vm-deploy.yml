name: FE Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy App
        run: |
          # The EOF is quoted (<< 'EOF') to prevent shell variable expansion on the GitHub Runner.
          # All variable expansion (like ${{ secrets.APP_DIR }}) happens before the script is sent to the VM.
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.APP_DIR }}

            # If directory has git, reset and pull; else initialize repo
            if [ -d ".git" ]; then
              echo "Directory has git, pulling latest..."
              git reset --hard
              git clean -fd
              git pull origin main
            else
              echo "Directory not a git repo, initializing..."
              git init
              # 🚨 FIX: Using the PAT secret for authentication in the HTTPS URL
              # The secret 'ACTIONS_PAT' must be created in your GitHub repo settings.
              git remote add origin https://${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}.git
              git fetch
              # Check out the main branch
              git checkout -t origin/main
            fi

            # Install dependencies
            npm install --legacy-peer-deps # Added flag for modern npm versions

            # Restart app via PM2
            pm2 delete fe-app || true
            pm2 start npm --name fe-app -- run dev
            pm2 save
          EOF
