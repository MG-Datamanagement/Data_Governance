name: FE Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy App
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.APP_DIR }}

            # If directory has git, reset and pull; else initialize repo
            if [ -d ".git" ]; then
              echo "Directory has git, pulling latest..."
              git reset --hard
              git clean -fd
              git pull origin main
            else
              echo "Directory not a git repo, initializing..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
              git fetch
              git checkout -t origin/main
            fi

            # Install dependencies
            npm install -i

            # Restart app via PM2
            pm2 delete fe-app || true
            pm2 start npm --name fe-app -- run dev
            pm2 save
          EOF
